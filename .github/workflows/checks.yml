name: Build and update protocol
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - run: python tests/generate_fixtures.py
      - run: dotnet run --project tests/UpdateTests.csproj -- tests/fixtures
      - run: dotnet build windows/PixelVolume.csproj -c Release
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - run: python tests/generate_fixtures.py
      - run: xcrun swiftc -swift-version 5 macos/UpdateClient.swift tests/main.swift -o /tmp/pixel-volume-update-tests
      - run: /tmp/pixel-volume-update-tests tests/fixtures
      - run: bash macos/build.sh
